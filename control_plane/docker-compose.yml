services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: local_n8n_orchestrator
    restart: unless-stopped
    network_mode: "host"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - /home/dsama/hybrid_mesh_ai/vault:/data/storage
      - /home/dsama/hybrid_mesh_ai/vault/documentation:/files

volumes:
  n8n_data:
